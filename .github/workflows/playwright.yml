name: Playwright Tests
# Manual only: no automatic run on push or pull request.
# Keep "Use workflow from" on main (the workflow file lives there); pick the branch to test in the "branch" input.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the tests from (e.g. develop, main)'
        required: true
        type: string
        default: 'develop'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
