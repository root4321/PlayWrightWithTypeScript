name: Cucumber Tests

# Manual only: no automatic run on push or pull request.
# Keep "Use workflow from" on main (the workflow file lives there); pick the branch to test in the "branch" input.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run the tests from (e.g. develop, main)'
        required: true
        type: string
        default: 'develop'
      tags:
        description: 'Cucumber tag to run'
        required: true
        type: choice
        default: '@smoke'
        options:
          - '@smoke'
          - '@regression'
          - '@positive'
          - '@negative'
          - '@login'
          - '@sanity'
          - 'all'
      browser:
        description: 'Browser to run the tests in'
        required: true
        type: choice
        default: 'chromium'
        options:
          - chromium
          - chrome
          - firefox
          - webkit
      custom_tags:
        description: 'Optional custom tag expression, overrides the selection above (e.g. "@smoke and not @negative")'
        required: false
        type: string

jobs:
  cucumber:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Show run configuration
        run: echo "Branch=${{ inputs.branch }} Browser=${{ inputs.browser }} Tags=${{ inputs.custom_tags != '' && inputs.custom_tags || inputs.tags }}"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: |
          if [ "${{ inputs.browser }}" = "chrome" ]; then
            npx playwright install --with-deps chrome
          else
            npx playwright install --with-deps ${{ inputs.browser }}
          fi
      - name: Run Cucumber tests
        env:
          BROWSER: ${{ inputs.browser }}
          SELECTED_TAGS: ${{ inputs.custom_tags != '' && inputs.custom_tags || inputs.tags }}
        run: |
          if [ "$SELECTED_TAGS" = "all" ]; then
            npx cucumber-js
          else
            npx cucumber-js --tags "$SELECTED_TAGS"
          fi
      - name: Upload Cucumber report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: test-results/cucumber-report.html
          retention-days: 30
